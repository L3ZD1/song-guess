<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Song Guesser Pro</title>
<style>
body { font-family: Arial; background:#121212; color:white; text-align:center; padding:30px; }
button { padding:10px 20px; margin:10px; border:none; border-radius:8px; background:#1db954; color:white; cursor:pointer; }
input { padding:10px; width:260px; border-radius:6px; border:none; }
#game { margin-top:20px; }
</style>
</head>
<body>

<h1>🎵 Song Guesser PRO</h1>
<p>Угадай песню за короткий отрывок</p>

<div id="menu">
<button onclick="startGame()">🚀 Начать игру</button>
</div>

<div id="game" style="display:none;">
  <p id="level">Уровень: 1</p>
  <p id="timer">Время: 10</p>
  <button onclick="playSnippet()">▶️ Играть</button><br>
  <input id="answer" placeholder="Введите название">
  <br>
  <button onclick="submitAnswer()">Ответить</button>
  <p id="result"></p>
  <p id="score">Очки: 0</p>
  <p id="streak">Стрик: 0 🔥</p>
</div>

<script>
const songs = [
 {src:"songs/song1.mp3", answer:"shape of you"},
 {src:"songs/song2.mp3", answer:"blinding lights"}
];

let current=0, score=0, streak=0, level=1, time=10, timer;
let audio = new Audio();

function startGame(){
 document.getElementById("menu").style.display="none";
 document.getElementById("game").style.display="block";
 nextRound();
}

function playSnippet(){
 audio.src = songs[current].src;
 audio.currentTime = Math.random()*20; // случайный момент
 audio.play();
 setTimeout(()=>audio.pause(), 5000); // 5 секунд
}

function startTimer(){
 time = 10;
 document.getElementById("timer").innerText="Время: "+time;
 timer = setInterval(()=>{
  time--;
  document.getElementById("timer").innerText="Время: "+time;
  if(time<=0){ clearInterval(timer); fail(); }
 },1000);
}

function submitAnswer(){
 clearInterval(timer);
 let input = document.getElementById("answer").value.toLowerCase();
 let correct = songs[current].answer;

 if(input.includes(correct)){
  score+=10*level;
  streak++;
  level = Math.floor(streak/3)+1;
  document.getElementById("result").innerText="✅ Верно!";
 } else {
  fail(correct);
  return;
 }

 updateUI();
 nextRound();
}

function fail(correct){
 streak=0;
 document.getElementById("result").innerText="❌ Неверно! Ответ: "+(correct||songs[current].answer);
 updateUI();
 setTimeout(nextRound,2000);
}

function nextRound(){
 current = Math.floor(Math.random()*songs.length);
 document.getElementById("answer").value="";
 startTimer();
}

function updateUI(){
 document.getElementById("score").innerText="Очки: "+score;
 document.getElementById("streak").innerText="Стрик: "+streak+" 🔥";
 document.getElementById("level").innerText="Уровень: "+level;
}
</script>

</body>
</html>

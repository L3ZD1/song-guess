<!DOCTYPE html>
<html>
<head>
    <title>SongGuesser</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1 class="title">🎵 SongGuesser</h1>

    <div class="card">
      <div class="cover"></div>

      <div class="controls">
        <button id="playBtn" onclick="togglePlay()">▶</button>

        <input id="guess" placeholder="Название или артист">

        <button onclick="submitGuess()">Guess</button>
      </div>

      <p id="result"></p>

      <div class="stats">
        <span id="score">Score: 0</span>
        <span id="streak">Streak: 0</span>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
